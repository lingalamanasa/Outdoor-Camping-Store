<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – Stackly Outdoor &amp; Camping Store</title>
  <meta name="description" content="Create your free Stackly adventurer account to unlock member-only gear deals, custom trail fitting, and guided expedition bookings." />
  <link rel="icon" type="image/webp" href="assets/logo.webp" />
  <link rel="shortcut icon" type="image/webp" href="assets/logo.webp" />
  <link rel="apple-touch-icon" href="assets/logo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css?v=85" />
  <style>
    body {
      background: #f4f8f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      color: #0a1a0d;
    }

    .auth-page-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      width: 100%;
      box-sizing: border-box;
    }

    /* ===== CARD WRAPPER ===== */
    .auth-wrapper {
      width: 100%;
      max-width: 1040px;
      min-height: 640px;
      display: flex;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(10, 26, 13, 0.08);
      border: 1px solid rgba(82, 183, 136, 0.25);
      margin: 0 auto;
    }

    /* ===== LEFT HERO PANEL ===== */
    .auth-hero {
      width: 42%;
      flex-shrink: 0;
      position: relative;
      background-image:
        linear-gradient(180deg, rgba(10,26,13,0.2) 0%, rgba(10,26,13,0.85) 100%),
        url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=900&auto=format&fit=crop&q=80');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 44px 38px;
      color: #ffffff;
    }
    .auth-hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .auth-hero p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.88);
      line-height: 1.6;
      margin: 0;
    }

    /* ===== RIGHT FORM PANEL ===== */
    .auth-form-panel {
      flex: 1;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 38px 48px;
      box-sizing: border-box;
      width: 100%;
      justify-content: center;
    }

    /* TOP ROW */
    .auth-form-toprow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1.5px solid rgba(82, 183, 136, 0.3);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #0a1a0d;
      text-decoration: none;
      background: #ffffff;
      transition: all 0.2s ease;
    }
    .btn-back:hover { background: rgba(82, 183, 136, 0.08); border-color: #52b788; color: #0a1a0d; }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
    }
    .auth-brand img { height: 28px; width: auto; }

    /* FORM BODY */
    .auth-form-body {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    .auth-form-body h3 {
      font-family: 'Playfair Display', serif;
      font-size: 27px;
      font-weight: 700;
      color: #0a1a0d;
      text-align: center;
      margin: 0 0 6px;
    }
    .auth-subtitle {
      font-size: 13.5px;
      color: #405a48;
      text-align: center;
      margin: 0 0 24px;
      line-height: 1.5;
    }

    /* FORM FIELDS */
    .form-group {
      margin-bottom: 16px;
      width: 100%;
      box-sizing: border-box;
    }
    .form-row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #0a1a0d;
      margin-bottom: 6px;
    }
    .required-star { color: #52b788; margin-left: 2px; }
    .input-field {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      background: #ffffff;
      border: 1.5px solid rgba(82, 183, 136, 0.28);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #0a1a0d;
      outline: none;
      transition: all 0.2s ease;
      min-height: 48px;
    }
    .input-field:focus {
      border-color: #52b788;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.15);
    }
    .input-field::placeholder { color: #829a8a; }
    .pw-wrap {
      position: relative;
      width: 100%;
      box-sizing: border-box;
    }
    .pw-wrap .input-field {
      padding-right: 50px !important;
    }
    .pw-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      color: #405a48;
      font-size: 16px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 2;
      border-radius: 6px;
      transition: color 0.18s;
    }
    .pw-toggle:hover { color: #52b788; }

    /* TERMS ROW */
    .terms-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
      margin-top: 4px;
      font-size: 13px;
    }
    .terms-row input[type="checkbox"] {
      accent-color: #2d6a4f;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 2px;
      cursor: pointer;
    }
    .terms-row label {
      color: #405a48;
      cursor: pointer;
      line-height: 1.5;
      margin: 0;
      font-weight: 500;
    }
    .terms-row label a {
      color: #2d6a4f;
      text-decoration: none;
      font-weight: 600;
    }
    .terms-row label a:hover { text-decoration: underline; color: #52b788; }

    /* SUBMIT BUTTON */
    .btn-create {
      width: 100%;
      background: #0a1a0d;
      color: #ffffff;
      border: 1.5px solid #0a1a0d;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 18px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(10, 26, 13, 0.18);
    }
    .btn-create:hover { background: #52b788; border-color: #52b788; color: #0a1a0d; transform: translateY(-1px); }

    /* SWITCH LINK */
    .auth-switch {
      text-align: center;
      font-size: 13.5px;
      color: #405a48;
      margin: 0;
    }
    .auth-switch a {
      font-weight: 700;
      color: #2d6a4f;
      text-decoration: none;
      margin-left: 4px;
    }
    .auth-switch a:hover { text-decoration: underline; color: #52b788; }

    /* ===== RESPONSIVE MEDIA QUERIES ===== */
    @media (max-width: 900px) {
      .auth-hero { display: none; }
      .auth-wrapper { max-width: 540px; border-radius: 20px; }
      .auth-form-panel { padding: 32px 30px; }
      .auth-page-container { padding: 32px 16px; }
    }

    @media (max-width: 580px) {
      .form-row-2col { grid-template-columns: 1fr; gap: 0; }
      .auth-page-container { padding: 20px 12px; }
      .auth-wrapper { border-radius: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
      .auth-form-panel { padding: 24px 18px; }
      .auth-form-body h3 { font-size: 23px; }
      .auth-subtitle { font-size: 13px; margin-bottom: 18px; }
      .auth-form-toprow { margin-bottom: 18px; }
      .form-group { margin-bottom: 14px; }
    }

    @media (max-width: 360px) {
      .auth-page-container { padding: 16px 8px; }
      .auth-form-panel { padding: 20px 14px; }
    }
  </style>
</head>
<body>

  <!-- ===== MAIN AUTH CONTENT ===== -->
  <main class="auth-page-container">
    <div class="auth-wrapper">

      <!-- LEFT HERO -->
      <div class="auth-hero">
        <h2>Start your journey<br />with Stackly.</h2>
        <p>Build your outdoor adventure story or find the perfect gear for your team.</p>
      </div>

      <!-- RIGHT FORM -->
      <div class="auth-form-panel">

        <!-- TOP ROW -->
        <div class="auth-form-toprow">
          <a href="index.html" class="btn-back">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Home
          </a>
          <a href="index.html" class="auth-brand" title="Stackly Home">
            <img src="https://raw.githubusercontent.com/lingalamanasa/Outdoor-Camping-Store/main/assets/logo.webp" alt="Stackly" class="brand-logo-img" onerror="this.onerror=null; this.src='assets/logo.webp';" />
          </a>
        </div>

        <!-- FORM BODY -->
        <div class="auth-form-body">
          <h3>Create your account</h3>
          <p class="auth-subtitle">Stackly is here to support your outdoor needs every step of the way.</p>

          <form onsubmit="handleSignup(event); return false;">

            <div class="form-group">
              <label for="sup-fname">Full Name <span class="required-star">*</span></label>
              <input type="text" id="sup-fname" class="input-field" placeholder="Enter your full name" required autocomplete="name" />
            </div>

            <div class="form-group">
              <label for="sup-email">Email <span class="required-star">*</span></label>
              <input type="email" id="sup-email" class="input-field" placeholder="name@company.com" required autocomplete="email" />
            </div>

            <div class="form-row-2col">
              <div class="form-group">
                <label for="sup-password">Password <span class="required-star">*</span></label>
                <div class="pw-wrap">
                  <input type="password" id="sup-password" class="input-field" placeholder="••••••••" required autocomplete="new-password" />
                  <button type="button" class="pw-toggle" onclick="togglePw('sup-password', this)" aria-label="Toggle password visibility">
                    <i class="fa-regular fa-eye"></i>
                  </button>
                </div>
              </div>

              <div class="form-group">
                <label for="sup-repassword">Re-enter password <span class="required-star">*</span></label>
                <div class="pw-wrap">
                  <input type="password" id="sup-repassword" class="input-field" placeholder="••••••••" required autocomplete="new-password" />
                  <button type="button" class="pw-toggle" onclick="togglePw('sup-repassword', this)" aria-label="Toggle password visibility">
                    <i class="fa-regular fa-eye"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- CUSTOM RESPONSIVE ROLE DROPDOWN (NO NATIVE SELECT) -->
            <div class="form-group">
              <label for="sup-role">Role <span class="required-star">*</span></label>
              <div class="custom-dropdown" id="dropdown-sup-role">
                <input type="hidden" id="sup-role" name="user_role" value="user" required />
                <button type="button" class="custom-dropdown-trigger" id="sup-role-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Select role">
                  <span class="custom-dropdown-value" id="sup-role-value">User</span>
                  <span class="custom-dropdown-arrow"><i class="fa-solid fa-chevron-down"></i></span>
                </button>
                <div class="custom-dropdown-menu" role="listbox" id="sup-role-menu" aria-labelledby="sup-role-trigger">
                  <div class="custom-dropdown-option is-selected" role="option" data-value="user" aria-selected="true" tabindex="0">
                    <span>User</span>
                    <i class="fa-solid fa-check option-check"></i>
                  </div>
                  <div class="custom-dropdown-option" role="option" data-value="admin" aria-selected="false" tabindex="0">
                    <span>Admin</span>
                    <i class="fa-solid fa-check option-check" style="display:none;"></i>
                  </div>
                </div>
              </div>
            </div>

            <div class="terms-row">
              <input type="checkbox" id="sup-terms" required />
              <label for="sup-terms">I have read and agree to the <a href="404.html">Terms and conditions</a></label>
            </div>

            <button type="submit" class="btn-create" id="signup-submit-btn">Create account</button>

            <p class="auth-switch">Already have an account?<a href="login.html">Login</a></p>

          </form>
        </div>

      </div>
    </div>
  </main>

  <script src="script.js?v=250"></script>
  <script>
    function togglePw(id, btn) {
      const input = document.getElementById(id);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="fa-regular fa-eye"></i>';
      }
    }
  </script>
</body>
</html>
