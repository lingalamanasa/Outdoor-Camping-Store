<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – Stackly Outdoor &amp; Camping Store</title>
  <meta name="description" content="Create your free Stackly adventurer account to unlock member-only gear deals, custom trail fitting, and guided expedition bookings." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=66" />
</head>
<body>

  <!-- DEDICATED SIGNUP PAGE VIEW -->
  <div id="page-signup" class="page-view active" style="display:block;">
    <section class="auth-hero-section" style="background-image: linear-gradient(135deg, rgba(12,24,16,0.72) 0%, rgba(5,15,10,0.82) 100%), url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=1600&q=80');">
      <div class="container auth-hero-container">
        
        <!-- LEFT: DARK GLASS FORM CARD -->
        <div class="auth-glass-card">
          <form class="auth-custom-form" onsubmit="handleSignup(event)">
            
            <div class="form-field-group">
              <label for="sup-fname">👤 FIRST NAME</label>
              <input type="text" id="sup-fname" class="pill-input" placeholder="Elena" required />
            </div>

            <div class="form-field-group">
              <label for="sup-lname">👤 LAST NAME</label>
              <input type="text" id="sup-lname" class="pill-input" placeholder="Voss" required />
            </div>

            <div class="form-field-group">
              <label for="sup-email">✉ EMAIL</label>
              <input type="email" id="sup-email" class="pill-input" placeholder="you@stackly.store" required />
            </div>

            <div class="form-field-group">
              <label for="sup-password">🔒 PASSWORD</label>
              <div class="pill-input-wrap">
                <input type="password" id="sup-password" class="pill-input" placeholder="At least 8 characters" required />
                <button type="button" class="pw-eye-btn" onclick="togglePw('sup-password', this)">👁</button>
              </div>
            </div>

            <!-- CUSTOM ROLE SELECTION SHEET MATCHING REFERENCE IMAGE 2 -->
            <div class="form-field-group" style="margin-top:14px;">
              <label style="font-size:11px; font-weight:800; letter-spacing:1px; color:#a78bfa; margin-bottom:8px; display:block;">💼 SELECT ROLE</label>
              <div class="role-sheet-container">
                <label class="role-radio-item" onclick="selectRoleRadio(this)">
                  <span class="role-radio-label">Supply Chain Leader</span>
                  <input type="radio" name="user_role" value="Supply Chain Leader" />
                  <span class="custom-radio-circle"></span>
                </label>
                <label class="role-radio-item" onclick="selectRoleRadio(this)">
                  <span class="role-radio-label">Supply Chain Manager</span>
                  <input type="radio" name="user_role" value="Supply Chain Manager" />
                  <span class="custom-radio-circle"></span>
                </label>
                <label class="role-radio-item" onclick="selectRoleRadio(this)">
                  <span class="role-radio-label">Logistics Director</span>
                  <input type="radio" name="user_role" value="Logistics Director" />
                  <span class="custom-radio-circle"></span>
                </label>
                <label class="role-radio-item" onclick="selectRoleRadio(this)">
                  <span class="role-radio-label">Warehouse Admin</span>
                  <input type="radio" name="user_role" value="Warehouse Admin" />
                  <span class="custom-radio-circle"></span>
                </label>
                <label class="role-radio-item selected" onclick="selectRoleRadio(this)">
                  <span class="role-radio-label">Enterprise Executive</span>
                  <input type="radio" name="user_role" value="Enterprise Executive" checked />
                  <span class="custom-radio-circle"></span>
                </label>
              </div>
            </div>

            <div class="auth-form-terms">
              <input type="checkbox" id="sup-terms" required checked />
              <label for="sup-terms">I agree to Stackly's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
            </div>

            <button type="submit" class="btn-primary auth-submit-btn" style="background:#cbd5e1; color:#0f172a; font-weight:800;">Create Account →</button>

            <div class="auth-divider"><span>OR CONTINUE WITH</span></div>

            <div class="social-auth-row">
              <button type="button" class="social-auth-btn" onclick="socialAuth('google')">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#ea4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.3 8.8 5 12 5z"/><path fill="#4285f4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#fbbc05" d="M5.3 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.6 7.4C.6 9.4 0 10.6 0 12s.6 2.6 1.6 4.6l3.7-1.8z"/><path fill="#34a853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.2 0-5.8-2.3-6.7-5.3L1.6 16C3.5 19.8 7.4 23 12 23z"/></svg>
                Google
              </button>
              <button type="button" class="social-auth-btn" onclick="socialAuth('apple')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><path d="M18.7 19.5c-.8 1.2-1.7 2.4-3 2.4-1.3 0-1.7-.8-3.2-.8-1.5 0-2 .8-3.2.8-1.3 0-2.3-1.2-3.1-2.4-1.7-2.4-3-6.8-1.2-9.9.9-1.5 2.5-2.5 4.2-2.5 1.3 0 2.5.9 3.3.9.8 0 2.3-1.1 3.9-1 1.6.1 3.1.7 4 2-3.5 2.1-2.9 6.8.6 8.3-.7 1.7-1.6 3.4-2.3 4.3zM15.5 6.4c.7-.9 1.2-2.1 1-3.4-1.1.1-2.4.8-3.1 1.6-.6.8-1.2 2-1 3.2 1.3.1 2.5-.5 3.1-1.4z"/></svg>
                Apple
              </button>
            </div>
            
            <p class="auth-bottom-switch">Already have an account? <a href="login.html"><strong>Login</strong></a></p>
          </form>
        </div>

        <!-- RIGHT: SERIF HERO TYPOGRAPHY -->
        <div class="auth-hero-info">
          <a href="index.html" class="logo" onclick="window.location.href='index.html'; return false;" style="display:inline-flex; align-items:center; gap:10px; margin-bottom:30px; text-decoration:none; cursor:pointer;">
            <div class="logo-mark">
              <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="20" fill="url(#signupLogoGrad)"/>
                <path d="M20 9L7 29H33L20 9Z" fill="#ffffff" opacity="0.95"/>
                <path d="M20 15L13 29H27L20 15Z" fill="#2d6a4f"/>
                <path d="M20 20L16 29H24L20 20Z" fill="#ffffff"/>
                <defs>
                  <linearGradient id="signupLogoGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#52b788"/>
                    <stop offset="100%" stop-color="#1a4731"/>
                  </linearGradient>
                </defs>
              </svg>
            </div>
            <span class="logo-text" style="color:#fff; font-size:28px; font-weight:800;">Stack<span class="logo-accent" style="color:#52b788;">ly</span></span>
          </a>
          <span class="auth-tagline" style="display:block;">JOIN STACKLY</span>
          <h1 class="auth-serif-title">Begin an<br />extraordinary<br />journey</h1>
          <p class="auth-serif-desc">Create your account to unlock curated stays, member pricing and moments crafted for you.</p>
          
          <div class="auth-pill-badges">
            <span class="auth-badge-pill">25k+ curated stays</span>
            <span class="auth-badge-pill">20 destinations</span>
            <span class="auth-badge-pill">4.9 avg rating</span>
          </div>
        </div>

      </div>
    </section>
  </div>

  <script src="script.js?v=66"></script>
</body>
</html>
