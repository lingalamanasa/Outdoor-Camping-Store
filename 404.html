<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Page Not Found – Stackly Outdoor &amp; Camping Store</title>
  <meta name="description" content="Oops! The page you are looking for might have been removed, had its name changed, or is temporarily unavailable." />
  <link rel="icon" type="image/webp" href="assets/logo.webp" />
  <link rel="shortcut icon" type="image/webp" href="assets/logo.webp" />
  <link rel="apple-touch-icon" href="assets/logo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      width: 100%;
      background-color: #FAF8F5;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      color: #1E252B;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .error-container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-code {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(84px, 14vw, 126px);
      font-weight: 800;
      line-height: 1;
      color: #8B1E3F;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      user-select: none;
    }

    .error-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
      line-height: 1.2;
      color: #1A1F2C;
      letter-spacing: -0.01em;
      margin-bottom: 18px;
    }

    .error-desc {
      font-size: clamp(14.5px, 2vw, 16px);
      font-weight: 400;
      line-height: 1.6;
      color: #555E68;
      max-width: 480px;
      margin-bottom: 34px;
      padding: 0 10px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 13px 28px;
      border-radius: 9999px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      min-width: 150px;
    }

    .btn svg {
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .btn-primary {
      background-color: #181B24;
      color: #FFFFFF;
      border: 1.5px solid #181B24;
      box-shadow: 0 2px 8px rgba(24, 27, 36, 0.08);
    }

    .btn-primary:hover {
      background-color: #2A303F;
      border-color: #2A303F;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(24, 27, 36, 0.16);
    }

    .btn-primary:hover svg {
      transform: scale(1.08);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: #181B24;
      border: 1.5px solid #DCE1E8;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .btn-secondary:hover {
      background-color: #F8FAFC;
      border-color: #CBD5E1;
      color: #0F172A;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }

    .btn-secondary:hover svg {
      transform: translateX(-3px);
    }

    .btn-secondary:active {
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      .btn-group {
        flex-direction: column;
        gap: 12px;
      }
      .btn {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>

  <main class="error-container" role="main">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Page Not Found</h2>
    <p class="error-desc">
      Oops! The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    
    <div class="btn-group">
      <a href="index.html" class="btn btn-primary" id="btn-back-home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Back to Home</span>
      </a>

      <button type="button" class="btn btn-secondary" id="btn-go-back" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href='index.html'; }">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>Go Back</span>
      </button>
    </div>
  </main>

</body>
</html>
