<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - 404 - Stackly</title>
  <meta name="description" content="Oops! The page you are looking for does not exist.">
  
  <!-- Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-forest: #0B1F14;
      --color-accent: #52B788;
      --color-white: #FFFFFF;
      --color-bg: #F5F8F6;
      --font-serif: "Playfair Display", serif;
      --font-sans: "Open Sans", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-forest);
      height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .error-container {
      max-width: 600px;
      text-align: center;
      padding: 40px 24px;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(96px, 15vw, 150px);
      line-height: 1;
      color: var(--color-accent);
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }

    .error-title {
      font-family: var(--font-serif);
      font-size: clamp(24px, 5vw, 36px);
      line-height: 1.25;
      font-weight: 400;
      margin-bottom: 16px;
      color: var(--color-forest);
    }

    .error-desc {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(11, 31, 20, 0.75);
      margin-bottom: 36px;
      max-width: 460px;
      margin-left: auto;
      margin-right: auto;
    }

    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      font-family: var(--font-sans);
      font-size: 14.5px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .btn-primary {
      background-color: var(--color-forest);
      color: var(--color-white);
      border: 1.5px solid var(--color-forest);
    }

    .btn-primary:hover {
      background-color: var(--color-accent);
      border-color: var(--color-accent);
      color: var(--color-forest);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(82, 183, 136, 0.25);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--color-forest);
      border: 1.5px solid rgba(11, 31, 20, 0.25);
    }

    .btn-secondary:hover {
      background-color: var(--color-white);
      border-color: var(--color-forest);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(11, 31, 20, 0.08);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .error-actions {
        flex-direction: column;
        width: 100%;
        gap: 12px;
      }
      
      .btn {
        width: 100%;
        padding: 14px 20px;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">Oops! The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    
    <div class="error-actions">
      <!-- Back to Home -->
      <a href="index.html" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Back to Home
      </a>
      
      <!-- Go Back -->
      <button onclick="goBack()" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Go Back
      </button>
    </div>
  </div>

  <script>
    function goBack() {
      // If there is history, navigate back
      if (document.referrer && window.history.length > 1) {
        window.history.back();
      } else {
        // Fallback to index if no referrer
        window.location.href = "index.html";
      }
    }
  </script>

</body>
</html>
