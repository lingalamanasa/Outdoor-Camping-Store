<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Stackly Outdoor &amp; Camping Store</title>
  <meta name="description" content="Login to your Stackly adventurer account to access your member dashboard, booking history, and rental gear." />
  <link rel="icon" type="image/webp" href="assets/logo.webp" />
  <link rel="shortcut icon" type="image/webp" href="assets/logo.webp" />
  <link rel="apple-touch-icon" href="assets/logo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=75" />
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-glass-card">
      
      <div class="auth-grid-split">
        
        <!-- LEFT: SERIF HERO TYPOGRAPHY -->
        <div class="auth-hero-info">
          <a href="index.html" class="logo header-logo-link" onclick="window.location.href='index.html'; return false;" style="display:inline-flex; align-items:center; margin-bottom:30px; text-decoration:none; cursor:pointer;">
            <img src="assets/logo.webp" alt="Stackly Logo" class="brand-logo-img" style="height:38px; width:auto;" />
          </a>
          <span class="auth-tagline" style="display:block;">WELCOME BACK</span>
          <h1 class="auth-serif-title">Begin an<br />extraordinary<br />journey</h1>
          <p class="auth-serif-desc">Login to your account to continue managing curated stays, accessing member pricing, and reliving moments crafted for you.</p>
          
          <div class="auth-pill-badges">
            <span class="auth-badge-pill">25k+ curated stays</span>
            <span class="auth-badge-pill">20 destinations</span>
            <span class="auth-badge-pill">4.9 avg rating</span>
          </div>
        </div>

        <!-- RIGHT: DARK GLASS FORM CARD -->
        <div class="auth-glass-card">
          <form class="auth-custom-form" onsubmit="handleLogin(event)">
            
            <div class="form-field-group">
              <label for="lin-email">✉ EMAIL</label>
              <input type="email" id="lin-email" class="pill-input" placeholder="you@stackly.store" required />
            </div>

            <div class="form-field-group">
              <label for="lin-uname">👤 USERNAME (OPTIONAL)</label>
              <input type="text" id="lin-uname" class="pill-input" placeholder="NAME" />
            </div>

            <div class="form-field-group">
              <label for="lin-password">🔒 PASSWORD</label>
              <div class="pill-input-wrap">
                <input type="password" id="lin-password" class="pill-input" placeholder="At least 8 characters" required />
                <button type="button" class="pw-eye-btn" onclick="togglePw('lin-password', this)">👁</button>
              </div>
            </div>

            <div class="form-field-group">
              <label for="lin-role">👤 ROLE</label>
              <div class="select-pill-wrap">
                <select id="lin-role" class="pill-input select-pill" required>
                  <option value="">Select your role</option>
                  <option value="user">User</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
            </div>

            <div class="auth-row-right" style="text-align: right; margin-bottom: 20px;">
              <a href="#" class="forgot-link" onclick="handleDashboardAction(event)" style="font-size: 13px; color: rgba(255,255,255,0.7); text-decoration: none;">Forgot password?</a>
            </div>

            <button type="submit" class="btn-pill-submit">Login →</button>
            <a href="index.html" class="btn-pill-submit" style="display: block; text-align: center; text-decoration: none; margin-top: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);">Back to Home</a>
            
            <p class="auth-bottom-switch">Don't have an account? <a href="signup.html"><strong>Sign up</strong></a></p>
          </form>
        </div>

      </div>
    </section>
  </div>

  <script src="script.js?v=70"></script>
</body>
</html>
